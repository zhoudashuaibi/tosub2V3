services:
  tosub2:
    build: .
    image: ghcr.io/zhoudashuaibi/tosub2v3:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1999:1999"       # 只绑本机，由反代转发；确需直连再改 0.0.0.0
    volumes:
      - ./data:/app/data
    environment:
      TOSUB2_CONSOLE_PASSWORD: ${TOSUB2_CONSOLE_PASSWORD:-}   # 首次种子，可留空走首访引导
      TOSUB2_SECRET_KEY: ${TOSUB2_SECRET_KEY:-}               # 建议显式提供
      TOSUB2_PORT: "1999"
    mem_limit: 1g
